# DScape site configuration (custom theme, no Chirpy)

title: DScape
tagline: Earth, seen from orbit
description: >-
  Earth observation imagery, visualizations and stories by Manos Lagoudakis,
  made with Copernicus Sentinel and other satellite data.
url: "https://dscape.gr"
baseurl: ""
lang: en
timezone: Europe/Rome

author:
  name: Manos Lagoudakis
  email: manoslag2002@yahoo.gr   # public contact address: About page, footer, RSS feed

# Used by jekyll-seo-tag and the site footer/header
social:
  name: Manos Lagoudakis
  links:
    - https://www.linkedin.com/in/lagoudakis/
    - https://github.com/elagoudakis
    - https://x.com/MLagoudakis
twitter:
  username: MLagoudakis
linkedin: https://www.linkedin.com/in/lagoudakis/
github_profile: https://github.com/elagoudakis

# Visitor statistics with GoatCounter (no cookies, no personal data).
# Paste your GoatCounter code, e.g. "dscape" for dscape.goatcounter.com. Empty = off.
goatcounter: ""

# Default share image when a post has no `image`
image: /assets/img/S2C_delivers/S2C_first_light_banner.jpg
logo: /assets/img/avatar/digital_scape_logo_only.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Keep the old Chirpy URLs so existing links keep working
      permalink: /posts/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - docs
  - tools
  - "*.zip"
  - "dscape-*"
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
