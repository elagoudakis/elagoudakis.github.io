<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Light by default; remember the reader's choice */
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  {% seo %}
  {%- unless page.image %}
  <meta property="og:image" content="{{ site.image | absolute_url }}">
  <meta name="twitter:image" content="{{ site.image | absolute_url }}">
  {%- endunless %}
  {% feed_meta %}
  <link rel="preload" href="{{ '/assets/fonts/archivo-latin-700-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {%- if site.goatcounter != "" and jekyll.environment == "production" %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="{{ '/assets/js/lib/goatcounter-count.js' | relative_url }}"></script>
  {%- endif %}
</head>
