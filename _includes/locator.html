<figure class="locator" data-locator data-lat="{{ include.lat }}" data-lon="{{ include.lon }}" data-name="{{ include.name | escape }}">
  <div class="locator-map"></div>
  <figcaption class="visually-hidden">Globe showing {{ include.name }}</figcaption>
</figure>
<span hidden data-land-url="{{ '/assets/data/land-110m.json' | relative_url }}"></span>
<script src="{{ '/assets/js/lib/d3-array.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/lib/d3-geo.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/locator.js' | relative_url }}" defer></script>
