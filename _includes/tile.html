{%- assign _post = include.post -%}
<li class="tile" data-mission="{{ _post.categories | first }}">
  <a href="{{ _post.url | relative_url }}">
    {%- if _post.image.path %}
    <img src="{{ _post.image.path | relative_url }}" alt="{{ _post.image.alt | escape }}" loading="lazy">
    {%- else %}
    <span class="tile-placeholder">Image coming soon</span>
    {%- endif %}
    {% include meta-line.html post=_post %}
    <span class="tile-title-row">
      <span class="tile-title">{{ _post.title }}</span>
      <span class="badge">{{ _post.kind | default: "story" | capitalize }}</span>
    </span>
  </a>
</li>
